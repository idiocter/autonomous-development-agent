[project]
name = "autonomous-dev-agent"
version = "0.1.0"
description = "Autonomous software development agent: GitHub issue -> plan -> code -> test -> debug -> PR"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.40",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
github = [
    "PyGithub>=2.3",
    "GitPython>=3.1",
    "PyJWT[crypto]>=2.9",
]
sandbox = [
    "docker>=7",
]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "langgraph-checkpoint-postgres>=1.0",
]
rag = [
    "sentence-transformers>=3.0",
    "voyageai>=0.3",
    "pathspec>=0.12",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures/toy_repo has its own intentionally-buggy test suite used AS
# a fixture by the agent itself -- it must not be collected as part of this
# project's own test suite.
norecursedirs = ["tests/fixtures"]
asyncio_mode = "auto"
# Function-scoped event loops (pytest-asyncio's default) don't mix with the
# module-level async engine singleton in src/db/session.py -- asyncpg's pool
# binds to whichever loop first touches it, so a fresh per-test loop hits
# "another operation is in progress" on the second test. Session scope
# matches how the engine is actually used in production (one long-lived
# loop per process), so tests should share one too.
asyncio_default_fixture_loop_scope = "session"
