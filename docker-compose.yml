services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autonomous-dev-agent-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: autonomous_dev_agent
    ports:
      - "5433:5432"  # 5432 is taken by another local project; app connects via 5433
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d autonomous_dev_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
